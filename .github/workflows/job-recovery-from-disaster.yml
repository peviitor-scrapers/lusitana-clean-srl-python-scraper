name: job-recovery-from-disaster

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore company record in Peviitor Core
        run: |
          python -c "from scraper.api import upsert_company; from scraper.config import company_config; print(upsert_company(company_config))"
