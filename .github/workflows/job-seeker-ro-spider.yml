name: job-seeker-ro-spider

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LUSITANA CLEAN S.R.L. scraper
        run: python -m scraper.index

      - name: Commit updated docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.md docs/company.json
          git diff --cached --quiet || git commit -m "Update scraped jobs for LUSITANA CLEAN S.R.L."
          git push
